<!DOCTYPE html>
<html lang="es">

<!-- configuración y recursos -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Canva & Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@300;400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<!-- ENCABEZADO -->
    <header class="header">
        <div class="container">
            <div class="top-bar">
                <img src="images/logotipo.png" alt="Logo Canva & Code" class="logo-circular">
                <button class="btn-private">ÁREA PRIVADA</button>
            </div>
            <nav class="button-nav">
                <a href="index.html" class="nav-btn">INICIO</a>
                <a href="about.html" class="nav-btn">ABOUT US</a>
                <a href="#" class="nav-btn">HISTORIA DEL FESTIVAL</a>
                <a href="#" class="nav-btn">EQUIPO</a>
                <a href="#" class="nav-btn">SPONSORS</a>
                <a href="expo.html" class="nav-btn active">EXPOSICIÓN INTERACTIVA</a>
                <a href="comunidad.html" class="nav-btn">COMUNIDAD</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero-section">
            <h1 class="main-title">EXPOSICIÓN <span>INTERACTIVA</span></h1>
            <p class="body-text"><strong>Modifica la obra libremente</strong></p>
        </section>
    
        <!-- ACCESIBILIDAD 1.1.1 / 1.3.1: Etiquetas claras para botones de acción -->
        <nav class="expo-actions" aria-label="Herramientas de edición">
            <button class="icon-btn" aria-label="Reiniciar cambios">
                <img src="../images/rotacion.png" alt="" aria-hidden="true" class="action-icon">
            </button>
            <button class="icon-btn" aria-label="Compartir obra">
                <img src="../images/compartir.png" alt="" aria-hidden="true" class="action-icon">
            </button>
            <button class="icon-btn" aria-label="Descargar imagen">
                <img src="../images/descargas.png" alt="" aria-hidden="true" class="action-icon">
            </button>
            <button class="icon-btn" aria-label="Ver historial de cambios">
                <img src="../images/historial.png" alt="" aria-hidden="true" class="action-icon">
            </button>
        </nav>
    
        <!-- Obra Principal con ID para manipulación -->
        <div class="main-canvas">
            <figure class="img-container canvas-frame">
                <img id="main-image" src="../images/paisaje1.jpg" alt="Paisaje de montaña: obra interactiva actual" class="card-image">
            </figure>
        </div>
    
        <!-- ACCESIBILIDAD 1.3.1: Galería de selección con roles adecuados -->
        <section class="selector-section" aria-labelledby="selector-title">
            <p id="selector-title" class="category">Elige una obra inicial</p>
            <div class="thumbs-grid" role="listbox" aria-label="Selecciona una miniatura para cambiar la obra principal">
                <button class="thumb-item active" role="option" aria-selected="true" onclick="changeMainImage(this)">
                    <img src="../images/paisaje2.jpg" alt="Paisaje costero">
                </button>
                <button class="thumb-item" role="option" aria-selected="false" onclick="changeMainImage(this)">
                    <img src="../images/paisaje3.jpg" alt="Puente sobre lago">
                </button>
                <!-- ... resto de imágenes ... -->
            </div>
        </section>
    
        <!-- ACCESIBILIDAD 1.3.1 / 1.3: Uso de fieldset y labels vinculados -->
        <section class="controls-section">
            <h2 class="category" style="text-align: center;">Modifica parámetros</h2>
            
            <div class="parameter-tabs" role="tablist">
                <button class="tab-btn active" id="tab-color" role="tab" aria-selected="true" aria-controls="panel-color">COLOR</button>
                <button class="tab-btn" id="tab-ilu" role="tab" aria-selected="false" aria-controls="panel-iluminacion">ILUMINACIÓN</button>
            </div>
    
            <div id="panel-color" role="tabpanel" aria-labelledby="tab-color">
                <fieldset class="slider-group">
                    <legend class="card-title">AJUSTES DE COLOR</legend>
                    
                    <div class="control-row">
                        <label for="red-range" class="body-text">ROJO</label>
                        <input type="range" id="red-range" class="range-slider" min="0" max="100" value="70">
                    </div>
                    <div class="control-row">
                        <label for="green-range" class="body-text">VERDE</label>
                        <input type="range" id="green-range" class="range-slider" min="0" max="100" value="50">
                    </div>
                </fieldset>
            </div>
        </section>
    
        <!-- ACCESIBILIDAD 1.1 / 1.3.1: Prompt con label explícito -->
        <section class="prompt-section">
            <label for="ai-prompts" class="category" style="display: block; text-align: center;">Añade Prompts</p>
            <textarea id="ai-prompts" class="prompt-input" placeholder="Ej: Añade un cielo estrellado..."></textarea>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="body-text">2026 CANVAS & CODE.</p>
                
                <!-- Redes Sociales-->
                <div class="social-links">
                    <a href="https://facebook.com" target="_blank" class="social-btn">
                        <img src="images/facebook.png" alt="Facebook">
                    </a>
                    <a href="https://X.com" target="_blank" class="social-btn">
                        <img src="images/xlogo.png" alt="X">
                    </a>
                    <a href="https://instagram.com" target="_blank" class="social-btn">
                        <img src="images/instagram.png" alt="Instagram">
                    </a>
                    <a href="https://tiktok.com" target="_blank" class="social-btn">
                        <img src="images/tik-tok.png" alt="TikTok">
                    </a>
                    <a href="https://whatsapp.com" target="_blank" class="social-btn">
                        <img src="images/whatsapp.png" alt="WhatsApp">
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
