        <section class="selector-section" aria-labelledby="selector-title">

            <div class="thumbs-grid" role="listbox" aria-label="Selecciona una miniatura para cambiar la obra principal">
                <button class="thumb-item active" role="option" aria-selected="true" onclick="changeMainImage(this)">

                </button>

                <button class="thumb-item" role="option" aria-selected="false" onclick="changeMainImage(this)">

                </button>
            </div>
        </section>

       <!-- Script para elegir la fotografía a modificar -->
        <script>
            function changeMainImage(element) {
                // 1. Localizamos la imagen principal y la imagen dentro de la miniatura clickeada
                const mainImg = document.getElementById('main-image');
                const thumbImg = element.querySelector('img');
                
                // 2. Almacenamos temporalmente los datos de la imagen principal actual
                const tempSrc = mainImg.src;
                const tempAlt = mainImg.alt;
                
                // 3. Realizamos el intercambio (Swap)
                // La principal ahora es la que estaba en la miniatura
                mainImg.src = thumbImg.src;
                mainImg.alt = thumbImg.alt;
                
                // La miniatura ahora muestra la que antes era la principal
                thumbImg.src = tempSrc;
                thumbImg.alt = tempAlt;
                
                // 4. Gestión visual de la selección (Feedback)
                // Quitamos el borde verde de todas las miniaturas
                document.querySelectorAll('.thumb-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                // Añadimos el borde verde a la nueva imagen principal (que ahora está en la miniatura)
                element.classList.add('active');
            }
        </script>
<!-- Panel de Control de Parámetros -->

        </div>

</section>

<!-- Script para elegir las modificaciones -->
<script>
    function showPanel(panelId, btn) {
        // Ocultar todos los paneles
        document.querySelectorAll('.adjustment-panel').forEach(p => p.style.display = 'none');
        // Mostrar el panel seleccionado
        document.getElementById('panel-' + panelId).style.display = 'block';
        
        // Quitar clase activa de todos los botones
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        // Añadir clase activa al botón pulsado
        btn.classList.add('active');
    }
</script>
